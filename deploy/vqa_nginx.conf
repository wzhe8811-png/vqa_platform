# VQA 平台反向代理：AutoDL 公网端口 6006/6008
# 6006: 离线轨迹浏览(7860) + 用户门户(7862) 按路径分流
# 6008: 在线问答(7861)

upstream trace_app  { server 127.0.0.1:7860; }
upstream chat_app   { server 127.0.0.1:7861; }
upstream portal_app { server 127.0.0.1:7862; }

# ---- 公网端口 1: 6006 主入口 ----
server {
    listen 6006;
    server_name _;
    client_max_body_size 30m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # portal 专属路径 → 7862
    location ~ ^/(login|register|logout|chat)(/|$) {
        proxy_pass http://portal_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/auth(/|$) {
        proxy_pass http://portal_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/conversations(/|$) {
        proxy_pass http://portal_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/portal_static(/|$) {
        proxy_pass http://portal_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # portal 静态资源（trace 无 /static 引用，无冲突）
    location ~ ^/static(/|$) {
        proxy_pass http://portal_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # portal 上传图（/uploads/<user_id>/<filename> 两段）
    location ~ ^/uploads/[^/]+/[^/]+$ {
        proxy_pass http://portal_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余全部 → 7860 离线轨迹浏览
    location / {
        proxy_pass http://trace_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- 公网端口 2: 6008 在线问答 ----
server {
    listen 6008;
    server_name _;
    client_max_body_size 30m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://chat_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
